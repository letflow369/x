name: Socrates visual validation

on:
  push:
    branches:
      - feature/socrates-investigation

permissions:
  contents: write

jobs:
  validate:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      VISUAL_ROUTES: "artigos/socrates.html"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/socrates-investigation

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Synchronize home visual contract
        run: npm run sync:visual

      - name: Persist synchronized Socrates HTML
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artigos/socrates.html
          if git diff --cached --quiet; then
            echo 'Socrates HTML already synchronized.'
          else
            git commit -m 'style: align Socrates with home visual standard [skip ci]'
            git push origin HEAD:feature/socrates-investigation
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Audit source visual contract
        run: npm run audit:visual

      - name: Build site
        run: npm run build

      - name: Audit design system
        run: npm run audit:design

      - name: Audit structured data
        run: npm run audit:structured

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate Socrates visual contract
        run: npx playwright test tests/visual-standard.spec.js --workers=1 --retries=0

      - name: Validate Socrates geometry
        run: npx playwright test tests/site.spec.js --grep 'artigos/socrates.html' --workers=1 --retries=0

      - name: Run Socrates dedicated tests
        run: npx playwright test tests/socrates.spec.js --workers=1 --retries=0
