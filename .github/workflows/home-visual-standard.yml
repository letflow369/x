name: Home visual standard

on:
  push:
    branches:
      - feature/home-visual-standard

permissions:
  contents: write

jobs:
  verify-visual-stability:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      VISUAL_ROUTES: "assuntos/ciencia-tecnologia-sociedade.html,metodologia.html"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/home-visual-standard

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build site
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify previously flaky routes
        id: stability
        shell: bash
        run: |
          set +e
          npx playwright test tests/visual-standard.spec.js --workers=1 --retries=0 2>&1 | tee /tmp/home-visual-stability.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist stability report
        if: always()
        shell: bash
        run: |
          mkdir -p docs
          status='${{ steps.stability.outputs.status }}'
          if [ "$status" = '0' ]; then result='PASS'; else result='FAIL'; fi
          {
            echo '# Home visual standard — stability check'
            echo
            echo "Result: **$result**"
            echo
            echo "Commit tested: \`$(git rev-parse HEAD)\`"
            echo
            echo 'No retries are enabled in this verification.'
            echo
            echo '```text'
            cat /tmp/home-visual-stability.log 2>/dev/null || true
            echo '```'
          } > docs/home-visual-standard-stability.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/home-visual-standard-stability.md
          git commit -m "test: record visual stability $result [skip ci]" || true
          git push origin HEAD:feature/home-visual-standard

      - name: Fail when stability check failed
        if: steps.stability.outputs.status != '0'
        run: exit 1
