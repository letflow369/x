name: Home visual standard

on:
  push:
    branches:
      - feature/home-visual-standard

permissions:
  contents: write

jobs:
  diagnose-visual-contract:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      VISUAL_ROUTES: "artigos/borderline.html,artigos/cbd.html,artigos/deficiencia-intelectual.html,artigos/dmt.html,artigos/lsd.html,artigos/sindrome-de-down.html,artigos/terapia-cognitivo-comportamental.html,artigos/toc.html,artigos/vibracoes-estados-vibracionais.html"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/home-visual-standard

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Synchronize visual contract
        run: npm run sync:visual

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build site
        run: npm run build

      - name: Audit source visual contract
        run: npm run audit:visual

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Diagnose remaining routes
        id: diagnostics
        shell: bash
        run: |
          set +e
          npx playwright test tests/visual-standard.spec.js --workers=1 2>&1 | tee /tmp/home-visual-standard-diagnostics.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist diagnostic report
        if: always()
        shell: bash
        run: |
          mkdir -p docs
          status='${{ steps.diagnostics.outputs.status }}'
          if [ "$status" = '0' ]; then result='PASS'; else result='FAIL'; fi
          {
            echo '# Home visual standard — targeted diagnostics'
            echo
            echo "Result: **$result**"
            echo
            echo "Commit tested: \`$(git rev-parse HEAD)\`"
            echo
            echo 'Routes: borderline, CBD, deficiência intelectual, DMT, LSD, síndrome de Down, TCC, TOC e vibrações/estados vibracionais.'
            echo
            echo '```text'
            cat /tmp/home-visual-standard-diagnostics.log 2>/dev/null || true
            echo '```'
          } > docs/home-visual-standard-diagnostics.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/home-visual-standard-diagnostics.md
          git commit -m "test: record targeted visual diagnostics $result [skip ci]" || true
          git push origin HEAD:feature/home-visual-standard

      - name: Fail when diagnostics failed
        if: steps.diagnostics.outputs.status != '0'
        run: exit 1
