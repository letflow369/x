name: Home visual standard

on:
  push:
    branches:
      - feature/home-visual-standard

permissions:
  contents: write

jobs:
  standardize-and-validate:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/home-visual-standard

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Synchronize visual contract
        run: npm run sync:visual

      - name: Persist synchronized HTML
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html' ':!dist'
          if git diff --cached --quiet; then
            echo 'No HTML synchronization changes.'
          else
            git commit -m 'style: synchronize home visual contract across pages [skip ci]'
            git push origin HEAD:feature/home-visual-standard
          fi

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run complete validation suite
        id: validation
        shell: bash
        run: |
          set +e
          log=/tmp/home-visual-standard.log
          : > "$log"
          status=0

          run_check() {
            echo "" | tee -a "$log"
            echo "### $*" | tee -a "$log"
            "$@" 2>&1 | tee -a "$log"
            rc=${PIPESTATUS[0]}
            if [ "$rc" -ne 0 ]; then
              status=$rc
            fi
          }

          run_check npm run audit:visual
          run_check npm run build
          run_check npm run audit:design
          run_check npm run audit:structured
          run_check npx playwright test tests/site.spec.js tests/visual-standard.spec.js --workers=2

          echo "status=$status" >> "$GITHUB_OUTPUT"
          cp "$log" /tmp/home-visual-standard-full.log
          exit 0

      - name: Persist validation report
        if: always()
        shell: bash
        run: |
          mkdir -p docs
          status='${{ steps.validation.outputs.status }}'
          if [ "$status" = '0' ]; then result='PASS'; else result='FAIL'; fi
          {
            echo '# Home visual standard — validation'
            echo
            echo "Result: **$result**"
            echo
            echo "Commit tested: \`$(git rev-parse HEAD)\`"
            echo
            echo 'Validation includes: source contract audit, build, design-system audit, structured-data audit, complete site Playwright suite and visual-standard Playwright suite.'
            echo
            echo '```text'
            tail -n 100 /tmp/home-visual-standard-full.log 2>/dev/null || true
            echo '```'
          } > docs/home-visual-standard-validation.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/home-visual-standard-validation.md
          git commit -m "test: record home visual standard validation $result [skip ci]" || true
          git push origin HEAD:feature/home-visual-standard

      - name: Fail when validation failed
        if: steps.validation.outputs.status != '0'
        run: exit 1
