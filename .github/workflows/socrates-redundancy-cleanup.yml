name: Socrates redundancy cleanup

on:
  push:
    branches:
      - feature/socrates-investigation

permissions:
  contents: write

jobs:
  validate:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      VISUAL_ROUTES: "artigos/socrates.html"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/socrates-investigation

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fold final reference surface into source rule
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/styles/socrates.css')
          text = path.read_text()
          old = '''.socrates-references {\n  padding-block: clamp(4rem, 8vw, 6rem);\n  color: var(--socrates-ink);\n  background: #f6f1e8;\n}'''
          new = '''.socrates-references {\n  padding-block: clamp(4rem, 8vw, 6rem);\n  color: var(--color-text);\n  background: var(--color-surface);\n  border-top: .0625rem solid var(--site-block-border);\n}'''
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('Reference surface rule not found')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/styles/socrates.css
          git commit -m 'fix: integrate Socrates reference surface tokens [skip ci]' || true
          git push origin HEAD:feature/socrates-investigation

      - name: Verify redundancy invariants
        shell: bash
        run: |
          test ! -e src/scripts/socrates-belief-lab.js
          test "$(grep -c 'src/scripts/socrates-investigation.js' artigos/socrates.html)" -eq 1
          ! grep -q 'socrates-belief-lab.js' artigos/socrates.html
          ! grep -q 'Socrates global visual contract compatibility' src/styles/socrates-sections.css
          ! grep -q '\.socrates-next' src/styles/socrates.css
          ! grep -q 'Sócrates permanece contido no viewport' tests/socrates.spec.js
          ! grep -q 'background: #f6f1e8' src/styles/socrates.css
          echo 'Redundancy invariants: OK'
          wc -l src/scripts/socrates-investigation.js src/styles/socrates.css src/styles/socrates-sections.css tests/socrates.spec.js

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run validation matrix
        id: validation
        shell: bash
        run: |
          set +e
          log=/tmp/socrates-redundancy-validation.log
          : > "$log"
          status=0

          run_check() {
            echo "" | tee -a "$log"
            echo "### $*" | tee -a "$log"
            "$@" 2>&1 | tee -a "$log"
            rc=${PIPESTATUS[0]}
            if [ "$rc" -ne 0 ]; then status=$rc; fi
          }

          run_check npm run audit:visual
          run_check npm run build
          run_check npm run audit:design
          run_check npm run audit:structured
          run_check npx playwright test tests/visual-standard.spec.js --workers=1 --retries=0
          run_check npx playwright test tests/site.spec.js --grep artigos/socrates.html --workers=1 --retries=0
          run_check npx playwright test tests/socrates.spec.js --workers=1 --retries=0

          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist validation report
        if: always()
        shell: bash
        run: |
          status='${{ steps.validation.outputs.status }}'
          if [ "$status" = '0' ]; then result='PASS'; else result='FAIL'; fi
          {
            echo '# Sócrates — limpeza de redundâncias'
            echo
            echo "Resultado: **$result**"
            echo
            echo "Commit testado: \`$(git rev-parse HEAD)\`"
            echo
            echo '## Métricas'
            echo
            echo '```text'
            wc -l src/scripts/socrates-investigation.js src/styles/socrates.css src/styles/socrates-sections.css tests/socrates.spec.js
            echo '```'
            echo
            echo '## Validação'
            echo
            echo '```text'
            tail -n 240 /tmp/socrates-redundancy-validation.log 2>/dev/null || true
            echo '```'
          } > docs/socrates-redundancy-validation.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/socrates-redundancy-validation.md
          git commit -m "test: record Socrates redundancy validation $result [skip ci]" || true
          git push origin HEAD:feature/socrates-investigation

      - name: Fail when validation failed
        if: steps.validation.outputs.status != '0'
        run: exit 1
