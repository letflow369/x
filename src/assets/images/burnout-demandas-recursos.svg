<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" viewBox="0 0 760 900" role="img" aria-labelledby="title desc">
<title id="title">Demandas, recursos e recuperação</title>
<desc id="desc">Composição abstrata com blocos de demandas, apoios e um arco que representa recuperação ao longo do tempo.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#11191d"/>
    <stop offset="1" stop-color="#171411"/>
  </linearGradient>
  <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7fa6b3"/>
    <stop offset="1" stop-color="#c89a5b"/>
  </linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<rect width="760" height="900" rx="48" fill="url(#bg)"/>
<circle cx="170" cy="190" r="110" fill="#7fa6b3" opacity=".08" filter="url(#soft)"/>
<circle cx="590" cy="690" r="130" fill="#c89a5b" opacity=".08" filter="url(#soft)"/>
<path d="M120 690 C190 540 300 470 380 455 C465 438 565 340 640 205" fill="none" stroke="url(#arc)" stroke-width="14" stroke-linecap="round" opacity=".88"/>
<path d="M123 690 C190 540 300 470 380 455 C465 438 565 340 640 205" fill="none" stroke="#0b0c10" stroke-width="3" stroke-linecap="round" opacity=".8"/>

<!-- demand blocks -->
<g opacity=".95">
  <rect x="92" y="188" width="190" height="70" rx="15" fill="#2a2728" stroke="#a86e5d" stroke-width="3"/>
  <rect x="112" y="278" width="220" height="70" rx="15" fill="#2a2728" stroke="#a86e5d" stroke-width="3"/>
  <rect x="150" y="368" width="230" height="70" rx="15" fill="#2a2728" stroke="#a86e5d" stroke-width="3"/>
  <line x1="120" y1="221" x2="250" y2="221" stroke="#d7c6ae" stroke-width="8" stroke-linecap="round" opacity=".7"/>
  <line x1="140" y1="311" x2="300" y2="311" stroke="#d7c6ae" stroke-width="8" stroke-linecap="round" opacity=".62"/>
  <line x1="178" y1="401" x2="347" y2="401" stroke="#d7c6ae" stroke-width="8" stroke-linecap="round" opacity=".55"/>
</g>

<!-- resources -->
<g>
  <circle cx="504" cy="540" r="54" fill="#20342d" stroke="#7f9f8b" stroke-width="4"/>
  <circle cx="616" cy="515" r="42" fill="#20342d" stroke="#7f9f8b" stroke-width="4"/>
  <circle cx="552" cy="650" r="46" fill="#24313b" stroke="#7fa6b3" stroke-width="4"/>
  <path d="M484 540 h40 M504 520 v40" stroke="#d8c8af" stroke-width="7" stroke-linecap="round"/>
  <path d="M597 515 h38" stroke="#d8c8af" stroke-width="7" stroke-linecap="round"/>
  <path d="M534 650 h36 M552 632 v36" stroke="#d8c8af" stroke-width="7" stroke-linecap="round"/>
</g>

<!-- recovery resting line -->
<path d="M135 748 C240 795 432 792 620 735" fill="none" stroke="#7f9f8b" stroke-width="7" stroke-linecap="round" opacity=".78"/>
<circle cx="135" cy="748" r="10" fill="#7f9f8b"/>
<circle cx="620" cy="735" r="10" fill="#7f9f8b"/>

<!-- small particles -->
<g fill="#c89a5b" opacity=".72">
  <circle cx="420" cy="180" r="7"/><circle cx="470" cy="245" r="5"/><circle cx="575" cy="150" r="4"/>
</g>
</svg>