<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 960" role="img" aria-labelledby="title desc">
<title id="title">Ilustração abstrata sobre atenção, organização e impulsividade</title>
<desc id="desc">Caminhos, cartões de tarefas e círculos conectados representam funções do cotidiano. Não é uma imagem cerebral nem um instrumento diagnóstico.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0" stop-color="#111721"/>
    <stop offset="1" stop-color="#22191d"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#d8a258" stop-opacity=".48"/>
    <stop offset="1" stop-color="#d8a258" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="760" height="960" rx="42" fill="url(#bg)"/>
<circle cx="380" cy="470" r="280" fill="url(#glow)" opacity=".32"/>
<path d="M115 730 C178 600 122 486 246 390 C352 308 422 330 505 236 C553 181 600 166 659 174" fill="none" stroke="#c8914f" stroke-width="10" stroke-linecap="round" stroke-dasharray="18 18" opacity=".88"/>
<path d="M126 765 C244 718 292 672 343 590 C415 473 513 496 634 432" fill="none" stroke="#56859a" stroke-width="7" stroke-linecap="round" opacity=".76"/>
<path d="M105 224 C187 244 225 304 273 343" fill="none" stroke="#866aa0" stroke-width="7" stroke-linecap="round" opacity=".7"/>
<g font-family="Inter, Arial, sans-serif">
  <rect x="74" y="92" width="245" height="154" rx="24" fill="#161517" stroke="#65506f" stroke-width="3"/>
  <text x="104" y="135" fill="#b9a994" font-size="18" letter-spacing="2">PLANEJAR</text>
  <text x="104" y="183" fill="#f1e7d5" font-size="29">Dividir a tarefa</text>
  <circle cx="278" cy="130" r="19" fill="#866aa0"/>

  <rect x="421" y="120" width="260" height="168" rx="24" fill="#161517" stroke="#5d402b" stroke-width="3"/>
  <text x="451" y="166" fill="#b9a994" font-size="18" letter-spacing="2">PRIORIZAR</text>
  <text x="451" y="213" fill="#f1e7d5" font-size="29">Um passo agora</text>
  <circle cx="640" cy="160" r="19" fill="#c8914f"/>

  <rect x="98" y="416" width="270" height="172" rx="24" fill="#161517" stroke="#315d6c" stroke-width="3"/>
  <text x="128" y="462" fill="#b9a994" font-size="18" letter-spacing="2">LEMBRAR</text>
  <text x="128" y="508" fill="#f1e7d5" font-size="29">Agenda única</text>
  <text x="128" y="548" fill="#b9a994" font-size="20">registro + lembrete</text>
  <circle cx="328" cy="456" r="19" fill="#56859a"/>

  <rect x="445" y="430" width="234" height="170" rx="24" fill="#161517" stroke="#4f6556" stroke-width="3"/>
  <text x="475" y="476" fill="#b9a994" font-size="18" letter-spacing="2">PAUSAR</text>
  <text x="475" y="522" fill="#f1e7d5" font-size="29">Antes de agir</text>
  <circle cx="638" cy="470" r="19" fill="#5f8b6a"/>

  <rect x="191" y="702" width="380" height="150" rx="28" fill="#161517" stroke="#c8914f" stroke-width="3"/>
  <text x="221" y="750" fill="#b9a994" font-size="18" letter-spacing="2">APOIO INDIVIDUALIZADO</text>
  <text x="221" y="800" fill="#f1e7d5" font-size="30">Estratégia, contexto e cuidado</text>
</g>
<text x="380" y="916" text-anchor="middle" fill="#b9a994" font-family="Inter, Arial, sans-serif" font-size="18">Ilustração educativa — não diagnóstica</text>
</svg>