<path d="M454 550 C515 613 548 680 583 754" fill="none" stroke="url(#line)" stroke-width="7" stroke-linecap="round"/>

<g>
  <rect x="82" y="92" width="235" height="160" rx="26" fill="#17212b" stroke="#6f86a5" stroke-width="4"/>
  <circle cx="132" cy="142" r="18" fill="#6f86a5"/>
