<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 960" role="img" aria-labelledby="title desc">
<title id="title">Ilustração abstrata sobre diversidade do espectro autista</title>
<desc id="desc">Quatro áreas conectadas representam comunicação, processamento sensorial, previsibilidade e apoio, sem função diagnóstica.</desc>
<defs>
  <radialGradient id="bg" cx="45%" cy="35%" r="78%">
    <stop offset="0%" stop-color="#27313d"/>
    <stop offset="100%" stop-color="#0b0c10"/>
  </radialGradient>
  <linearGradient id="line" x1="0" x2="1">
    <stop offset="0%" stop-color="#c8914f"/>
    <stop offset="100%" stop-color="#6f86a5"/>
  </linearGradient>
</defs>
<rect width="760" height="960" rx="44" fill="url(#bg)"/>
<circle cx="380" cy="470" r="112" fill="#15171d" stroke="#c8914f" stroke-width="5"/>
<circle cx="380" cy="470" r="72" fill="#1d232c" stroke="#f1e7d5" stroke-width="2" opacity=".95"/>
<text x="380" y="455" text-anchor="middle" fill="#f1e7d5" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">PERFIL</text>
<text x="380" y="492" text-anchor="middle" fill="#b9a994" font-family="Inter,Arial,sans-serif" font-size="22">INDIVIDUAL</text>

