<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 900" role="img" aria-labelledby="title desc">
<title id="title">Ciclo cognitivo-comportamental</title><desc id="desc">Composição abstrata com cinco nós representando situação, interpretação, emoção e corpo, comportamento e consequência, ligados em ciclo.</desc>
