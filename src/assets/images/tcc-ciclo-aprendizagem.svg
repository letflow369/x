<g filter="url(#shadow)" font-family="Arial, sans-serif" text-anchor="middle">
<g transform="translate(380 145)"><circle r="74" fill="#152226" stroke="#8eb7b1" stroke-width="3"/><text y="-4" fill="#8eb7b1" font-size="18" font-weight="700">SITUAÇÃO</text><text y="24" fill="#e8e2d7" font-size="14">o que acontece</text></g>
<g transform="translate(605 315)"><circle r="82" fill="#1b1c25" stroke="#aa9bc1" stroke-width="3"/><text y="-5" fill="#aa9bc1" font-size="17" font-weight="700">INTERPRETAÇÃO</text><text y="23" fill="#e8e2d7" font-size="14">significados</text></g>
<g transform="translate(515 620)"><circle r="87" fill="#17221a" stroke="#96b89d" stroke-width="3"/><text y="-12" fill="#96b89d" font-size="16" font-weight="700">EMOÇÕES</text><text y="10" fill="#96b89d" font-size="16" font-weight="700">E CORPO</text><text y="38" fill="#e8e2d7" font-size="14">respostas</text></g>
<g transform="translate(245 620)"><circle r="82" fill="#241d19" stroke="#c08c72" stroke-width="3"/><text y="-5" fill="#c08c72" font-size="16" font-weight="700">COMPORTAMENTO</text><text y="23" fill="#e8e2d7" font-size="14">ações e esquivas</text></g>
<g transform="translate(155 315)"><circle r="80" fill="#25221a" stroke="#c3a876" stroke-width="3"/><text y="-5" fill="#c3a876" font-size="16" font-weight="700">CONSEQUÊNCIA</text><text y="23" fill="#e8e2d7" font-size="14">aprendizagem</text></g>
