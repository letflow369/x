<svg xmlns="http://www.w3.org/2000/svg" width="720" height="760" viewBox="0 0 720 760" role="img" aria-labelledby="t d"><title id="t">Regulação, identidade, vínculos e impulsos</title><desc id="d">Diagrama abstrato com quatro áreas interligadas a um centro de regulação e recuperação.</desc><defs><radialGradient id="bg"><stop offset="0" stop-color="#203943"/><stop offset="1" stop-color="#111318"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="720" height="760" rx="60" fill="url(#bg)"/><g stroke="#c99a59" stroke-width="3" fill="none" opacity=".7"><path d="M360 370L180 190"/><path d="M360 370L540 190"/><path d="M360 370L180 550"/><path d="M360 370L540 550"/></g><circle cx="360" cy="370" r="118" fill="#15181d" stroke="#c99a59" stroke-width="4" filter="url(#glow)"/><circle cx="180" cy="190" r="92" fill="#1b2b34" stroke="#7f9fb0" stroke-width="4"/><circle cx="540" cy="190" r="92" fill="#292332" stroke="#988eaa" stroke-width="4"/><circle cx="180" cy="550" r="92" fill="#1e2b22" stroke="#7e9c88" stroke-width="4"/><circle cx="540" cy="550" r="92" fill="#30231f" stroke="#a46d62" stroke-width="4"/><g fill="#f1eadf" font-family="Arial, sans-serif" text-anchor="middle"><text x="360" y="350" font-size="28" font-weight="700">Regulação</text><text x="360" y="385" font-size="22">e recuperação</text><text x="180" y="183" font-size="24" font-weight="700">Emoções</text><text x="180" y="213" font-size="16">intensidade</text><text x="540" y="183" font-size="24" font-weight="700">Identidade</text><text x="540" y="213" font-size="16">continuidade</text><text x="180" y="543" font-size="24" font-weight="700">Vínculos</text><text x="180" y="573" font-size="16">segurança</text><text x="540" y="543" font-size="24" font-weight="700">Impulsos</text><text x="540" y="573" font-size="16">controle</text></g><path d="M300 680 Q360 720 420 680" fill="none" stroke="#7e9c8