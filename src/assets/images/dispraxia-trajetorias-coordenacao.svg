<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 920" role="img" aria-labelledby="title desc">
<title id="title">Trajetórias de coordenação e aprendizagem motora</title>
<desc id="desc">Composição abstrata de pontos e trajetórias que convergem em uma sequência organizada, representando intenção, planejamento, movimento, feedback e adaptação.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151a22"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
  <linearGradient id="path" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7f97bd"/><stop offset=".55" stop-color="#72a7a3"/><stop offset="1" stop-color="#88a78f"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .track{fill:none;stroke:url(#path);stroke-width:3;stroke-linecap:round;opacity:.62;stroke-dasharray:10 12;animation:dash 14s linear infinite}
    .soft{fill:none;stroke:#536273;stroke-width:1.2;opacity:.45}
    .node{fill:#0f141b;stroke-width:2.2}
    .p1{stroke:#7f97bd}.p2{stroke:#72a7a3}.p3{stroke:#88a78f}.p4{stroke:#c19a68}
    .dot{filter:url(#glow);transform-box:fill-box;transform-origin:center;animation:pulse 4s ease-in-out infinite}
    .dot:nth-of-type(2){animation-delay:.8s}.dot:nth-of-type(3){animation-delay:1.6s}.dot:nth-of-type(4){animation-delay:2.4s}
    .label{font-family:Inter,system-ui,sans-serif;font-size:20px;font-weight:700;fill:#f1e7d5}
    .sub{font-family:Inter,system-ui,sans-serif;font-size:14px;fill:#b9a994;letter-spacing:.08em;text-transform:uppercase}
    @keyframes dash{to{stroke-dashoffset:-220}}
    @keyframes pulse{0%,100%{opacity:.7;transform:scale(.92)}50%{opacity:1;transform:scale(1.08)}}
    @media (prefers-reduced-motion: reduce){.track,.dot{animation:none}}
  </style>
</defs>
<rect x="20" y="20" width="720" height="880" rx="44" fill="url(#bg)" stroke="#3a414c"/>
<circle cx="380" cy="445" r="245" fill="none" stroke="#232c37" stroke-width="1"/>
<circle cx="380" cy="445" r="182" fill="none" stroke="#1f3740" stroke-width="1"/>
<path class="track" d="M105 170 C220 150 230 270 332 310 S455 270 520 350 S560 510 650 540"/>
<path class="track" d="M85 360 C185 310 255 360 310 430 S410 530 500 500 S590 420 665 455"/>
<path class="track" d="M130 690 C220 650 250 560 330 560 S470 650 560 610 S620 575 680 620"/>
<path class="soft" d="M160 240 L270 430 L180 610"/>
<path class="soft" d="M270 430 L390 280 L505 505 L585 365"/>
<path class="soft" d="M330 560 L505 505 L585 650"/>
<g>
  <circle class="node p1" cx="160" cy="240" r="42"/><circle class="dot" fill="#7f97bd" cx="160" cy="240" r="9"/>
  <text class="sub" x="160" y="306" text-anchor="middle">intenção</text>
</g>
<g>
  <circle class="node p2" cx="270" cy="430" r="48"/><circle class="dot" fill="#72a7a3" cx="270" cy="430" r="10"/>
  <text class="sub" x="270" y="503" text-anchor="middle">planejamento</text>
</g>
<g>
  <circle class="node p3" cx="505" cy="505" r="54"/><circle class="dot" fill="#88a78f" cx="505" cy="505" r="11"/>
  <text class="sub" x="505" y="585" text-anchor="middle">movimento</text>
</g>
<g>
  <circle class="node p4" cx="585" cy="365" r="38"/><circle class="dot" fill="#c19a68" cx="585" cy="365" r="8"/>
  <text class="sub" x="585" y="426" text-anchor="middle">feedback</text>
</g>
<g>
  <circle class="node p1" cx="585" cy="650" r="44"/><circle class="dot" fill="#7f97bd" cx="585" cy="650" r="9"/>
  <text class="sub" x="585" y="718" text-anchor="middle">adaptação</text>
</g>
<g opacity=".8">
  <circle fill="#7f97bd" cx="102" cy="170" r="6"/><circle fill="#72a7a3" cx="86" cy="359" r="6"/><circle fill="#88a78f" cx="132" cy="689" r="6"/>
  <circle fill="#c19a68" cx="650" cy="540" r="6"/><circle fill="#72a7a3" cx="666" cy="455" r="6"/><circle fill="#7f97bd" cx="680" cy="620" r="6"/>
</g>
<text class="label" x="380" y="790" text-anchor="middle">Coordenação não é um único ponto.</text>
<text class="sub" x="380" y="823" text-anchor="middle">é uma sequência de sistemas trabalhando juntos</text>
</svg>
